<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>毛主席诗词 · 一日一首</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="poetry.css"><script type="module" src="poetry.js"></script></head><body><div class="shell"><header class="topbar"><a class="brand" href="/"><span class="brand-icon">诗</span><span>毛主席诗词<span class="brand-sub">ONE POEM A DAY</span></span></a><a class="button" href="http://127.0.0.1:8866/">每日努力 ↗</a></header><main><section class="page-heading"><div><p class="eyebrow">编年背诵 · 每天一首</p><h1>循着岁月，一首一首记住。</h1><p class="muted">按你提供的 Excel 顺序安排，每天留一小段时间给诗词。</p></div><div class="date-control"><label for="poetry-date">查看每日任务</label><div><button class="icon-button" id="prev" aria-label="前一天">‹</button><input type="date" id="poetry-date" aria-label="查看背诵日期"><button class="icon-button" id="next" aria-label="后一天">›</button><button class="button" id="today">今天</button></div></div></section><div class="poetry-layout"><div><section class="poem-hero"><div class="section-heading"><p class="eyebrow light" id="task-date"></p><span id="task-order" class="poem-order"></span></div><p id="written" class="poem-written"></p><h2 id="poem-title"></h2><p id="poem-caution" class="small"></p><div class="poem-buttons"><button id="memorized" class="button primary">我已背诵</button><button id="hide-text" class="button">隐藏原文，自测一下</button></div><p id="poem-state" class="small" role="status"></p></section><section class="panel poem-reading"><div class="section-heading"><h2>诗词原文</h2><span class="small muted" id="text-state"></span></div><div id="poem-text" class="poem-text"></div><details id="text-editor"><summary>录入或修改原文</summary><label for="poem-original" class="field-label">粘贴你使用版本的原文，仅保存在本机</label><textarea id="poem-original" rows="10" placeholder="这份 Excel 只有题名与年代，不含全文。可在这里录入原文，便于遮住原文背诵。"></textarea><label for="poem-note" class="field-label">背诵笔记 / 易错字</label><textarea id="poem-note" rows="3"></textarea><button id="save-text" class="button primary">保存原文与笔记</button><p id="save-state" class="small muted" role="status"></p></details></section></div><aside><section class="panel"><div class="section-heading"><h2>背诵进度</h2><span id="progress-count"></span></div><div class="progress-track" role="progressbar" aria-label="诗词背诵进度" aria-valuemin="0" aria-valuemax="78" aria-valuenow="0"><div id="poetry-fill"></div></div><p id="plan-period" class="small muted"></p><p id="backlog" class="small muted"></p></section><section class="panel"><p class="eyebrow">DAILY REMINDER</p><h2>每天 07:45 · 背一首</h2><p class="small muted">北京时间。每日提醒会附上当天篇目；已打卡当天任务则不再催促。</p><button id="enable-notice" class="button">开启网页提醒</button><p id="notice-status" class="small muted" role="status">网页提醒需要保持页面运行。也可导入日历，在网页关闭后提醒。</p><button id="calendar" class="text-button">↓ 下载每日背诵日历</button></section><section class="panel"><h2>编年目录</h2><label class="field-label" for="search">搜索题名或创作年代</label><input id="search" class="poem-search" placeholder="例如：沁园春、1925"><div id="poem-list" class="poem-list"></div></section></aside></div><section class="poetry-source"><p id="source-scope"></p><p id="source-order"></p><p>日期不明的作品沿用表格顺序置于末尾。计划日期是你的背诵日期，与作品创作日期分开记录。</p><button id="export" class="text-button">↓ 备份背诵记录与原文</button></section><footer>每天一首，慢慢积累。<span>本机保存 · 编年背诵</span></footer></main></div></body></html>
