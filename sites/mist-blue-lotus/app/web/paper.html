<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>论文阅读工作台</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="paper-reader.css"><link rel="stylesheet" href="paper-workbench.css"><script type="module" src="paper-workbench.js"></script></head><body data-reader-page="true" class="paper-workbench-page"><main><div class="workbench-toolbar"><a href="arxiv.html" class="research-return-button" data-research-back>返回论文观测台</a><span>左侧原文 · 右侧阅读与整理</span><label>原文宽度<input type="range" id="paper-pane-width" min="40" max="75" value="58" aria-label="调整原文栏宽度"></label></div><div id="paper-workbench"><section class="paper-original-pane" aria-label="论文原文"><header><strong>论文原文</strong><a id="paper-source-link" class="button" target="_blank" rel="noopener" hidden>直接打开原文 ↗</a><button id="paper-pdf-retry" class="button" type="button">重试加载</button></header><p id="paper-pdf-status" role="status">正在准备原文……</p><div class="pdf-controls" id="pdf-controls" hidden><button class="button" id="pdf-zoom-out" aria-label="缩小论文">−</button><span id="pdf-zoom-label">适合宽度</span><button class="button" id="pdf-zoom-in" aria-label="放大论文">＋</button><button class="button" id="pdf-fit">适合宽度</button><span id="pdf-page-count"></span></div><div id="paper-original-frame" role="region" aria-label="完整论文 PDF，可独立滚动" hidden></div></section><section id="paper-workbench-notes" aria-label="阅读任务与笔记"></section></div></main></body></html>
