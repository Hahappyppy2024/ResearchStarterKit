<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研究笔记 · Blog</title><link rel="stylesheet" href="study-workspace.css"><link rel="stylesheet" href="workspace-pages.css"><link rel="stylesheet" href="research-desk.css"><script type="module" src="blog.js"></script></head><body class="research-desk-page"><main><header class="desk-heading"><div><h1>研究笔记 <small>Blog</small></h1><p>分类、写作与回顾 · 仅保存在本机</p></div><button class="primary" id="new-post">＋ 新笔记</button></header><div class="blog-desk"><aside class="desk-panel desk-tree"><div class="desk-panel-title"><h2>分类目录</h2><button id="new-folder" title="新建分类">＋</button></div><div id="folder-tree"></div><div class="desk-mini-actions"><button id="sub-folder">＋ 子分类</button><button id="rename-folder">重命名</button></div><div id="unclassified-view"></div><button id="archive-view" class="desk-nav">已归档笔记</button><button id="trash-view" class="desk-nav">回收站</button></aside><section class="desk-panel desk-editor" id="post-editor"></section><section class="desk-panel desk-timeline"><div class="desk-panel-title"><h2 id="timeline-title">笔记时间线</h2><small id="post-count"></small></div><input id="post-search" aria-label="搜索研究笔记" placeholder="搜索标题、标签、正文"><div id="posts"></div></section></div><dialog id="folder-dialog"><form id="folder-form"><h2 id="folder-form-title">新建分类</h2><label>分类名称<input id="folder-name" required maxlength="160"></label><label>上级分类<select id="folder-parent"></select></label><div class="actions"><button class="primary">保存分类</button><button type="button" id="close-folder">取消</button></div><p id="folder-status" role="status"></p></form></dialog></main></body></html>
