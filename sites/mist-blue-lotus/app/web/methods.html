<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>科研方法 · 学习与指导清单</title><link rel="stylesheet" href="study-workspace.css"><link rel="stylesheet" href="research-practice.css"><link rel="stylesheet" href="paper-reader.css"><link rel="stylesheet" href="methods-guide.css"><script type="module" src="methods-guide.js"></script><script type="module" src="research-practice.js"></script><link rel="stylesheet" href="research-desk.css"><link rel="stylesheet" href="three-desk.css"></head><body class="methods-desk"><main class="three-desk-main"><header class="three-desk-heading"><div><h1>科研方法</h1><p>从研究问题到论文表达，逐步积累自己的方法</p></div><div class="actions"><button id="new-method-post" class="primary">＋ 写方法文章</button><button id="new-method-resource">＋ 收藏外部链接</button></div></header><div class="three-desk-grid"><aside class="desk-category-column"><h2>方法分类</h2><nav id="method-categories"></nav><section class="panel"><h2>近期写作资源</h2><p class="small">按已知发布日期排列 · 来源核对：2026-10-23；未注明日期的指南单独标注。</p><div id="method-recent"></div></section></aside><section class="desk-timeline-column"><div class="section-heading"><h2 id="method-timeline-title">方法文章</h2><input id="method-search" aria-label="搜索方法文章" placeholder="搜索方法文章"></div><p id="method-status" role="status"></p><div id="method-timeline"></div></section><aside class="desk-reference-column"><section class="panel"><h2>学习方法与指导笔记</h2><p class="small">原有笔记按用途分类，点击展开。</p><div id="methods-list"><details><summary>选题与研究问题</summary><div id="method-guides-research"></div></details><details><summary>文献阅读与脉络</summary><div id="method-guides-reading"></div></details><details><summary>基础准备与复现</summary><div id="method-guides-foundations"></div></details><details><summary>方法设计与实验</summary><div id="method-guides-experiments"></div></details><details><summary>论文写作</summary><div id="method-guides-writing"></div></details><details><summary>展示、投稿与复盘</summary><div id="method-guides-presentation"></div></details></div></section><section class="panel"><div class="section-heading"><h2>参考资源收藏</h2><button id="add-bookmark">＋</button></div><p class="small">保留链接，并记下它能帮你解决什么问题。</p><div id="method-bookmarks"></div></section><details class="panel"><summary>已归档文章与链接</summary><div id="method-archived"></div></details><details class="panel previous-practice"><summary>已有科研练习与成果记录</summary><p class="muted">之前保存的练习、成果和进展在这里继续保留。</p><label>查看日期<input id="date" class="date-control" type="date"></label><section id="research-practice" class="panel research-practice"><div class="section-heading"><div><p class="eyebrow">READ · EXPLAIN · VERIFY · CREATE</p><h2>每日科研练习</h2><p id="research-practice-context" class="small muted"></p></div><button id="research-practice-all" class="button" type="button">全部加入今日待办</button></div><p id="research-practice-progress" class="small muted" role="status"></p><div id="research-practice-papers" class="reader-actions"></div><div id="research-practice-tasks" class="research-practice-grid"></div><p id="research-practice-status" class="small muted" role="status"></p></section></details></aside></div></main><div id="toast" role="status" hidden></div><script type="module" src="methods-desk.js"></script></body></html>
