 <g id="bud" stroke="#98b9ca" stroke-width=".7"><path d="M0 0C-10-7-5-20 0-27C6-19 11-7 0 0Z" fill="url(#pink)"/><path d="M0 0Q-4-10 0-24M0 0Q5-10 0-24"/><path d="M-6-5L0 1 6-5" stroke="#8dafac"/></g>
