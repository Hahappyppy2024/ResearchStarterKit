 <linearGradient id="pink" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#fffaff"/><stop offset=".5" stop-color="#ecdce9"/><stop offset="1" stop-color="#b8b9d8"/></linearGradient>
 <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8ebe3"/><stop offset="1" stop-color="#98bbbd"/></linearGradient>
