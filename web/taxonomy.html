<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topic / Problem 定义</title><link rel="stylesheet" href="paper-reader.css"><style>body{font:16px system-ui;background:#f7f6ef;color:#183e36;margin:32px}header{display:flex;justify-content:space-between}main{display:grid;grid-template-columns:1fr 1.4fr;gap:28px}section,form{background:#fffef8;border:1px solid #dae2d1;border-radius:18px;padding:24px}label{display:block;margin:16px 0}input,textarea,select{display:block;box-sizing:border-box;width:100%;padding:12px;margin-top:6px;border:1px solid #cbd7c4;border-radius:8px;font:inherit}button,a{cursor:pointer;color:inherit}button{padding:12px;border:1px solid #cbd7c4;background:#edf2e6;border-radius:8px}#tree button{display:block;margin:9px 0;text-align:left}small{display:block;color:#789081}@media(max-width:700px){main{grid-template-columns:1fr}}</style><header><h1>Topic / Problem 定义</h1><a href="lineage.html">← 返回论文脉络</a></header><p>中英文名称、定义与三级层级由你维护；阅读论文时可以直接选用。同一篇论文可属于多个分类。</p><main><section><button id="new">＋ 新建定义</button><div id="tree"></div></section><form id="editor"><h2 id="heading">新建定义</h2><label>类型<select id="kind"><option value="topic">Topic · 研究主题</option><option value="problem">Problem · 研究问题</option></select></label><label>中文名称<input id="name" required maxlength="160"></label><label>English name<input id="en" required maxlength="200"></label><label>父分类<select id="parent"></select></label><label>定义与边界<textarea id="definition" rows="5"></textarea></label><button>保存定义</button><p id="status" role="status"></p></form></main><script type="module" src="taxonomy.js"></script></html>
