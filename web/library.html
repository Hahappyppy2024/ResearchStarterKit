<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>论文库 · 按 Topic 浏览</title><link rel="stylesheet" href="study-workspace.css"><link rel="stylesheet" href="paper-reader.css"><link rel="stylesheet" href="workspace-pages.css"><script type="module" src="library-home.js"></script></head><body class="library-page"><main><header><div><p class="eyebrow">PAPER LIBRARY · TOPICS FIRST</p><h1>论文库</h1><p>围绕一个 Topic，查看顶会论文与日常添加的论文。</p></div><div class="actions"><a class="button" href="reading.html">今日必读 ↗</a><button class="primary" id="add-paper">＋ 添加论文</button></div></header><div class="topic-library"><aside class="library-topics library-tree-sidebar"><h2>论文库</h2><p class="library-nav-subtitle">PAPER LIBRARY</p><input id="topic-search" aria-label="搜索 Topic" placeholder="搜索主题、分类"><div id="topic-list"></div><a href="taxonomy.html?kind=topic" class="button">管理我的 Topic ↗</a></aside><section class="panel library-results"><h2 id="topic-heading">全部 Topic</h2><div class="page-tabs"><button id="conference-tab" aria-pressed="true">顶会论文</button><button id="personal-tab" aria-pressed="false">日常添加论文</button></div><p class="library-filter-hint">选择会议，再选择年份，查看对应论文</p><nav id="venue-tabs" class="library-pills" aria-label="会议筛选"></nav><nav id="year-tabs" class="library-pills" aria-label="年份筛选"></nav><div class="actions"><input id="paper-search" aria-label="搜索论文" placeholder="搜索论文标题、作者"><select id="paper-state" aria-label="阅读状态"><option value="all">全部阅读状态</option><option value="pending">尚未读完</option><option value="read">已读</option></select></div><p id="paper-count" role="status">正在读取论文库…</p><p class="small" id="translation-note">中文标题及摘要为机器翻译，保留英文原文；无摘要时不会编写简介。</p><div id="paper-list"></div><div class="actions"><button id="library-prev">上一页</button><span id="library-page"></span><button id="library-next">下一页</button></div><p class="small" id="classification-note"></p></section></div><dialog id="paper-form-dialog"><form id="paper-form"><h2>添加到论文库</h2><label>论文标题<input name="title" required maxlength="500"></label><label>作者<input name="authors"></label><label>Topic（也可在阅读任务中继续分类）<select name="topicId" id="new-paper-topic"><option value="">自动归类／稍后整理</option></select></label><label>原文网页<input name="source" type="url"></label><label>PDF 链接<input name="pdf" type="url"></label><label>摘要或阅读原因<textarea name="summary" rows="6"></textarea></label><div class="actions"><button class="primary">保存到论文库</button><button type="button" id="close-form">关闭</button></div><p id="form-status" role="status"></p></form></dialog></main></body></html>
