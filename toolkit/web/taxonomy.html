<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Topic / Problem / Solution 定义</title><link rel="stylesheet" href="paper-reader.css"><style>body{font:16px system-ui;background:#f7f6ef;color:#183e36;margin:32px}header{display:flex;justify-content:space-between}main{display:grid;grid-template-columns:1fr 1.4fr;gap:28px}section,form{background:#fffef8;border:1px solid #dae2d1;border-radius:18px;padding:24px}label{display:block;margin:16px 0}input,textarea,select{display:block;box-sizing:border-box;width:100%;padding:12px;margin-top:6px;border:1px solid #cbd7c4;border-radius:8px;font:inherit}button,a{cursor:pointer;color:inherit}button{padding:12px;border:1px solid #cbd7c4;background:#edf2e6;border-radius:8px}#tree button{display:block;margin:9px 0;text-align:left}small{display:block;color:#789081}@media(max-width:700px){main{grid-template-columns:1fr}}</style><style>body{margin:24px!important;font-size:14px!important}main{grid-template-columns:255px minmax(0,1fr)!important;align-items:start}main>section{position:sticky;top:145px;max-height:75vh;overflow:auto;padding:18px}#tree h2{font-size:14px;margin:20px 0 6px}.taxonomy-choice{display:block;font-size:13px;padding:7px 12px;border-radius:7px;text-decoration:none;margin:2px 0}.taxonomy-choice[aria-current=true]{background:var(--theme-soft,#edf2e6);font-weight:700}#heading{font-size:23px}#taxonomy-search{padding:8px;font-size:13px}#view-lineage{display:inline-block;margin:18px 0}#editor{min-width:0}@media(max-width:700px){main{grid-template-columns:1fr!important}main>section{position:static;max-height:300px}}</style><style>#linked-topics{padding:14px;background:var(--theme-soft);border:1px solid var(--theme-line);border-radius:10px}.topic-picker-list{max-height:190px;overflow:auto}.topic-picker-list label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:12px}.topic-picker-list input[type=checkbox]{width:auto;display:i
